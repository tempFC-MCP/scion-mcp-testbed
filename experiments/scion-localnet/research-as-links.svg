  <title id="title">Research SCION deployment: inter-AS links</title>
  <desc id="description">All 27 deployed links. Example proposal routes from AS 201 to receiver ASes 301 and 302 use transit 110 as primary and 111 as backup. The inset shows links between the transit networks.</desc>
